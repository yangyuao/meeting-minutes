worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 8080;
    server_name _;
    root /home/teddy/Desktop/meeting-minutes/frontend/dist;
    index index.html;

    location / {
      try_files $uri /index.html;
    }
  }
}
