[project]
name = "meeting-minutes-backend"
version = "0.1.0"
description = "Meeting minutes backend service"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "python-dotenv",
  "requests",
  "funasr",
  "torch",
  "pymysql",
  "python-docx",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
